name: Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-packaging-release
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - 'config/offline-ai-manifest.json'
      - 'scripts/verify-package.mjs'
      - 'src/main/packaging/**'
      - '.github/workflows/windows-package.yml'

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Verify application
        run: npm run check

      - name: Build Windows installer
        run: npm run package:win

      - name: Verify packaged installer
        run: npm run verify:package

      - name: Assert exactly one Windows installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Filter 'Family-Circle-Setup-*.exe' -File)
          if ($installers.Count -ne 1) {
            Write-Error "Expected exactly one Family-Circle-Setup-*.exe, found $($installers.Count)."
            Get-ChildItem -Path release -Recurse -File | Select-Object -ExpandProperty FullName
            exit 1
          }
          Write-Host "Verified installer: $($installers[0].Name)"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: family-circle-windows-installer
          path: release/Family-Circle-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download verified Windows installer
        uses: actions/download-artifact@v8
        with:
          name: family-circle-windows-installer
          path: release

      - name: Assert release installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Filter 'Family-Circle-Setup-*.exe' -File)
          if ($installers.Count -ne 1) {
            Write-Error "Expected exactly one release installer, found $($installers.Count)."
            exit 1
          }
          Write-Host "Release installer: $($installers[0].Name)"

      - name: Publish tagged GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Family Circle $tag" --generate-notes --target '${{ github.sha }}'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $installer = (Get-ChildItem -Path release -Filter 'Family-Circle-Setup-*.exe' -File | Select-Object -First 1).FullName
          gh release upload $tag $installer --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
