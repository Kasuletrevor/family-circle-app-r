name: Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/windows-packaging-release
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - 'config/**'
      - 'third_party/**'
      - 'scripts/**'
      - 'vite*.ts'
      - 'tsconfig*.json'
      - '.github/workflows/windows-package.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - 'config/offline-ai-manifest.json'
      - 'config/offline-voice-manifest.json'
      - 'third_party/whisper.cpp-LICENSE.txt'
      - 'scripts/verify-package.mjs'
      - 'scripts/derive-semantic-release*.mjs'
      - 'scripts/verify-mail-api-config.mjs'
      - 'scripts/write-demo-mail-config.mjs'
      - 'scripts/write-demo-circle-config.mjs'
      - 'src/main/auth/**'
      - 'src/main/circle/**'
      - 'src/main/packaging/**'
      - 'src/main/story/**'
      - 'src/main/voice/**'
      - 'src/renderer/features/story/**'
      - 'src/renderer/services/story/**'
      - 'src/renderer/app/**'
      - 'src/renderer/main.tsx'
      - 'src/renderer/design-system/**'
      - 'src/renderer/assets/**'
      - 'src/shared/story.ts'
      - '.github/workflows/windows-package.yml'

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: read
      statuses: write
    outputs:
      release_eligible: ${{ steps.semantic_release.outputs.release_eligible }}
      release_type: ${{ steps.semantic_release.outputs.release_type }}
      release_impact: ${{ steps.semantic_release.outputs.release_impact }}
      release_version: ${{ steps.semantic_release.outputs.release_version }}
      release_tag: ${{ steps.semantic_release.outputs.release_tag }}
      release_base_tag: ${{ steps.semantic_release.outputs.release_base_tag }}
      release_title_b64: ${{ steps.semantic_release.outputs.release_title_b64 }}

    steps:
      - name: Checkout repository
        id: package_checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        id: package_setup_node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Derive semantic release version
        id: semantic_release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: node scripts/derive-semantic-release.mjs

      - name: Install dependencies
        id: package_install
        run: npm ci --no-audit

      - name: Verify mail API configuration
        id: package_verify_mail
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        env:
          SEND_EMAILS: ${{ vars.SEND_EMAILS }}
          MAIL_API_URL: ${{ vars.MAIL_API_URL }}
          MAIL_API_TIMEOUT_MS: ${{ vars.MAIL_API_TIMEOUT_MS }}
          MAIL_API_USER: ${{ secrets.MAIL_API_USER }}
          MAIL_API_PASSWORD: ${{ secrets.MAIL_API_PASSWORD }}
        run: node scripts/verify-mail-api-config.mjs

      - name: Verify application
        id: package_verify_application
        run: npm run check

      - name: Apply semantic version to package workspace
        id: package_apply_version
        if: steps.semantic_release.outputs.release_eligible == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.semantic_release.outputs.release_version }}'
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = node -p "require('./package.json').version"
          if ($actual -ne $version) { throw "Expected package version $version, got $actual" }
          Write-Host "Packaging Family Circle $version"

      - name: Generate demo mail config
        id: package_write_mail
        env:
          SEND_EMAILS: ${{ vars.SEND_EMAILS }}
          MAIL_API_URL: ${{ vars.MAIL_API_URL }}
          MAIL_API_TIMEOUT_MS: ${{ vars.MAIL_API_TIMEOUT_MS }}
          MAIL_API_USER: ${{ secrets.MAIL_API_USER }}
          MAIL_API_PASSWORD: ${{ secrets.MAIL_API_PASSWORD }}
        run: node scripts/write-demo-mail-config.mjs

      - name: Generate demo Circle config
        id: package_write_circle
        env:
          CIRCLE_API_URL: ${{ vars.CIRCLE_API_URL }}
          CIRCLE_API_KEY: ${{ secrets.CIRCLE_API_KEY }}
        run: node scripts/write-demo-circle-config.mjs

      - name: Build Windows installer
        id: package_build_installer
        run: npm run package:win

      - name: Verify packaged installer
        id: package_verify_installer
        run: npm run verify:package

      - name: Assert exactly one Windows installer
        id: package_assert_installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Filter 'Family-Circle-Setup-*.exe' -File)
          if ($installers.Count -ne 1) {
            Write-Error "Expected exactly one Family-Circle-Setup-*.exe, found $($installers.Count)."
            Get-ChildItem -Path release -Recurse -File | Select-Object -ExpandProperty FullName
            exit 1
          }
          Write-Host "Verified installer: $($installers[0].Name)"

      - name: Upload Windows installer artifact
        id: package_upload
        uses: actions/upload-artifact@v6
        with:
          name: family-circle-windows-installer
          path: release/Family-Circle-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Report Windows package stage
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_OUTCOME: ${{ steps.package_checkout.outcome }}
          SETUP_NODE_OUTCOME: ${{ steps.package_setup_node.outcome }}
          SEMANTIC_OUTCOME: ${{ steps.semantic_release.outcome }}
          RELEASE_ELIGIBLE: ${{ steps.semantic_release.outputs.release_eligible }}
          APPLY_VERSION_OUTCOME: ${{ steps.package_apply_version.outcome }}
          INSTALL_OUTCOME: ${{ steps.package_install.outcome }}
          VERIFY_MAIL_OUTCOME: ${{ steps.package_verify_mail.outcome }}
          VERIFY_APP_OUTCOME: ${{ steps.package_verify_application.outcome }}
          WRITE_MAIL_OUTCOME: ${{ steps.package_write_mail.outcome }}
          WRITE_CIRCLE_OUTCOME: ${{ steps.package_write_circle.outcome }}
          BUILD_OUTCOME: ${{ steps.package_build_installer.outcome }}
          VERIFY_INSTALLER_OUTCOME: ${{ steps.package_verify_installer.outcome }}
          ASSERT_INSTALLER_OUTCOME: ${{ steps.package_assert_installer.outcome }}
          UPLOAD_OUTCOME: ${{ steps.package_upload.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'

          $stage = 'verified'
          if ($env:CHECKOUT_OUTCOME -ne 'success') {
            $stage = 'checkout-failed'
          } elseif ($env:SETUP_NODE_OUTCOME -ne 'success') {
            $stage = 'setup-node-failed'
          } elseif ($env:SEMANTIC_OUTCOME -ne 'success') {
            $stage = 'semantic-version-failed'
          } elseif ($env:INSTALL_OUTCOME -ne 'success') {
            $stage = 'install-dependencies-failed'
          } elseif ($env:VERIFY_MAIL_OUTCOME -ne 'success') {
            $stage = 'mail-config-failed'
          } elseif ($env:VERIFY_APP_OUTCOME -ne 'success') {
            $stage = 'verify-application-failed'
          } elseif ($env:RELEASE_ELIGIBLE -eq 'true' -and $env:APPLY_VERSION_OUTCOME -ne 'success') {
            $stage = 'apply-version-failed'
          } elseif ($env:WRITE_MAIL_OUTCOME -ne 'success') {
            $stage = 'write-mail-config-failed'
          } elseif ($env:WRITE_CIRCLE_OUTCOME -ne 'success') {
            $stage = 'write-circle-config-failed'
          } elseif ($env:BUILD_OUTCOME -ne 'success') {
            $stage = 'build-installer-failed'
          } elseif ($env:VERIFY_INSTALLER_OUTCOME -ne 'success') {
            $stage = 'verify-package-failed'
          } elseif ($env:ASSERT_INSTALLER_OUTCOME -ne 'success') {
            $stage = 'assert-installer-failed'
          } elseif ($env:UPLOAD_OUTCOME -ne 'success') {
            $stage = 'artifact-upload-failed'
          }

          $state = if ($stage -eq 'verified') { 'success' } else { 'failure' }

          gh api `
            --method POST `
            "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -f "state=$state" `
            -f "context=demo-package-stage:$stage" `
            -f "description=Windows package stage: $stage" `
            -f "target_url=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "demo package stage: $stage"

  deploy-demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    outputs:
      release_eligible: ${{ steps.meta.outputs.release_eligible }}
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout repository
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v7

      - name: Setup Node
        id: setup_node
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download verified Windows installer
        id: download
        if: steps.setup_node.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: family-circle-windows-installer
          path: release

      - name: Prepare demo release metadata
        id: meta
        if: steps.download.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          RELEASE_ELIGIBLE: ${{ needs.package.outputs.release_eligible }}
          RELEASE_TYPE: ${{ needs.package.outputs.release_type }}
          RELEASE_VERSION: ${{ needs.package.outputs.release_version }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          RELEASE_TITLE_B64: ${{ needs.package.outputs.release_title_b64 }}
        run: |
          set -euo pipefail

          echo "release_eligible=$RELEASE_ELIGIBLE" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title_b64=$RELEASE_TITLE_B64" >> "$GITHUB_OUTPUT"

          if [[ "$RELEASE_ELIGIBLE" != "true" ]]; then
            echo "Server release skipped: commit is not an approved Conventional Commit."
            exit 0
          fi

          count="$(find release -maxdepth 1 -type f -name 'Family-Circle-Setup-*.exe' | wc -l | tr -d ' ')"
          if [[ "$count" != "1" ]]; then
            echo "Expected exactly one Windows installer, found $count" >&2
            exit 1
          fi

          installer="$(find release -maxdepth 1 -type f -name 'Family-Circle-Setup-*.exe' -printf '%f\n')"
          expected_installer="Family-Circle-Setup-${RELEASE_VERSION}.exe"
          if [[ "$installer" != "$expected_installer" ]]; then
            echo "Expected semantic installer $expected_installer, got $installer" >&2
            exit 1
          fi

          sha256="$(sha256sum "release/$installer" | awk '{print $1}')"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          build_id="${RELEASE_VERSION}-main-${GITHUB_SHA:0:7}"
          public_base_path="/electron-releases/demo"
          public_path="$public_base_path/latest/$installer"
          public_url="https://familycircle.o2gventures.com$public_path"

          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "demo_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"
          echo "public_base_path=$public_base_path" >> "$GITHUB_OUTPUT"
          echo "public_path=$public_path" >> "$GITHUB_OUTPUT"
          echo "public_url=$public_url" >> "$GITHUB_OUTPUT"
          echo "Semantic server release: $RELEASE_TAG ($build_id)"
      - name: Validate demo deployment credentials
        id: credentials
        if: steps.meta.outcome == 'success' && steps.meta.outputs.release_eligible == 'true'
        continue-on-error: true
        shell: bash
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_PASSWORD: ${{ secrets.DEV_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$DEV_SSH_HOST" ]] || { echo "DEV_SSH_HOST is not configured" >&2; exit 1; }
          [[ -n "$DEV_SSH_USER" ]] || { echo "DEV_SSH_USER is not configured" >&2; exit 1; }
          [[ -n "$DEV_SSH_PASSWORD" ]] || { echo "DEV_SSH_PASSWORD is not configured" >&2; exit 1; }

      - name: Install SSH tooling
        id: tooling
        if: steps.credentials.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client sshpass

      - name: Stage verified installer on demo server
        id: stage
        if: steps.tooling.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_PASSWORD: ${{ secrets.DEV_SSH_PASSWORD }}
          DEMO_VERSION: ${{ steps.meta.outputs.demo_version }}
          INSTALLER: ${{ steps.meta.outputs.installer }}
          EXPECTED_DEV_SSH_ED25519_FINGERPRINT: SHA256:i5zZS4Ydc4iAFzY8xpI0Md/bi/sCzzwcGMf9P6n06Dc
        run: |
          set -euo pipefail
          export SSHPASS="$DEV_SSH_PASSWORD"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          scan="$(ssh-keyscan -T 10 -t ed25519 "$DEV_SSH_HOST" 2>/dev/null)"
          [[ -n "$scan" ]] || { echo "Could not retrieve demo SSH host key" >&2; exit 1; }
          fingerprint="$(printf '%s\n' "$scan" | ssh-keygen -lf - | awk '{print $2}' | head -n 1)"
          if [[ "$fingerprint" != "$EXPECTED_DEV_SSH_ED25519_FINGERPRINT" ]]; then
            echo "Demo SSH host fingerprint mismatch" >&2
            exit 1
          fi
          printf '%s\n' "$scan" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          remote_stage="electron-release-staging/$DEMO_VERSION"
          sshpass -e ssh "$DEV_SSH_USER@$DEV_SSH_HOST" "mkdir -p '$remote_stage'"
          sshpass -e scp "release/$INSTALLER" scripts/publish-demo-release.sh "$DEV_SSH_USER@$DEV_SSH_HOST:$remote_stage/"

      - name: Publish demo release atomically
        id: publish
        if: steps.stage.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_PASSWORD: ${{ secrets.DEV_SSH_PASSWORD }}
          DEMO_VERSION: ${{ steps.meta.outputs.demo_version }}
          INSTALLER: ${{ steps.meta.outputs.installer }}
          INSTALLER_SHA256: ${{ steps.meta.outputs.sha256 }}
          PUBLISHED_AT: ${{ steps.meta.outputs.published_at }}
          RELEASE_TYPE: ${{ steps.meta.outputs.release_type }}
          RELEASE_TITLE_B64: ${{ steps.meta.outputs.release_title_b64 }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          BUILD_ID: ${{ steps.meta.outputs.build_id }}
          PUBLIC_BASE_PATH: ${{ steps.meta.outputs.public_base_path }}
        run: |
          set -euo pipefail
          export SSHPASS="$DEV_SSH_PASSWORD"
          remote_stage="electron-release-staging/$DEMO_VERSION"
          sshpass -e ssh "$DEV_SSH_USER@$DEV_SSH_HOST" \
            "bash '$remote_stage/publish-demo-release.sh' '/var/www/family-circle-prod/electron-releases/demo' '$DEMO_VERSION' '$INSTALLER' '$INSTALLER_SHA256' '$PUBLISHED_AT' '$GITHUB_SHA' '$PUBLIC_BASE_PATH' '$RELEASE_TYPE' '$RELEASE_TITLE_B64' '$RELEASE_TAG' '$BUILD_ID'"

      - name: Verify public demo installer
        id: verify_public
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.demo_version }}
          EXPECTED_SHA256: ${{ steps.meta.outputs.sha256 }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_RELEASE_TYPE: ${{ steps.meta.outputs.release_type }}
          EXPECTED_RELEASE_TITLE_B64: ${{ steps.meta.outputs.release_title_b64 }}
          EXPECTED_TAG: ${{ steps.meta.outputs.release_tag }}
          EXPECTED_BUILD: ${{ steps.meta.outputs.build_id }}
          PUBLIC_URL: ${{ steps.meta.outputs.public_url }}
        run: |
          set -euo pipefail

          cache_buster="${GITHUB_SHA:0:12}"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' "${PUBLIC_URL}?build=${cache_buster}" \
            -o /tmp/family-circle-public.exe

          actual_sha256="$(sha256sum /tmp/family-circle-public.exe | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "Public installer checksum mismatch" >&2
            exit 1
          fi

          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "https://familycircle.o2gventures.com/electron-releases/demo/current.json?build=${cache_buster}" \
            -o /tmp/current.json

          node - <<'NODE'
          const fs = require('node:fs')
          const current = JSON.parse(fs.readFileSync('/tmp/current.json', 'utf8'))
          if (current.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`Unexpected public demo version: ${current.version}`)
          }
          if (current.sha256 !== process.env.EXPECTED_SHA256) {
            throw new Error('Public demo metadata checksum mismatch')
          }
          if (current.tag !== process.env.EXPECTED_TAG) {
            throw new Error(`Unexpected public demo tag: ${current.tag}`)
          }
          if (current.build !== process.env.EXPECTED_BUILD) {
            throw new Error(`Unexpected public demo build: ${current.build}`)
          }
          if (current.commit !== process.env.EXPECTED_COMMIT) {
            throw new Error(`Unexpected public demo commit: ${current.commit}`)
          }
          if (current.type !== process.env.EXPECTED_RELEASE_TYPE) {
            throw new Error(`Unexpected public demo release type: ${current.type}`)
          }
          const expectedTitle = Buffer.from(process.env.EXPECTED_RELEASE_TITLE_B64 || '', 'base64').toString('utf8')
          if (current.title !== expectedTitle) {
            throw new Error(`Unexpected public demo release title: ${current.title}`)
          }
          NODE

          echo "Public demo verified: $PUBLIC_URL"
          echo "SHA256: $EXPECTED_SHA256"

      - name: Report deploy stage
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_NODE_OUTCOME: ${{ steps.setup_node.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          META_OUTCOME: ${{ steps.meta.outcome }}
          RELEASE_ELIGIBLE: ${{ steps.meta.outputs.release_eligible }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          TOOLING_OUTCOME: ${{ steps.tooling.outcome }}
          STAGE_OUTCOME: ${{ steps.stage.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_public.outcome }}
        run: |
          set -euo pipefail

          stage="verified"
          if [[ "$CHECKOUT_OUTCOME" != "success" ]]; then
            stage="checkout-failed"
          elif [[ "$SETUP_NODE_OUTCOME" != "success" ]]; then
            stage="setup-node-failed"
          elif [[ "$DOWNLOAD_OUTCOME" != "success" ]]; then
            stage="artifact-download-failed"
          elif [[ "$META_OUTCOME" != "success" ]]; then
            stage="metadata-failed"
          elif [[ "$RELEASE_ELIGIBLE" != "true" ]]; then
            stage="release-skipped"
          elif [[ "$CREDENTIALS_OUTCOME" != "success" ]]; then
            stage="credentials-failed"
          elif [[ "$TOOLING_OUTCOME" != "success" ]]; then
            stage="ssh-tooling-failed"
          elif [[ "$STAGE_OUTCOME" != "success" ]]; then
            stage="ssh-stage-failed"
          elif [[ "$PUBLISH_OUTCOME" != "success" ]]; then
            stage="publish-failed"
          elif [[ "$VERIFY_OUTCOME" != "success" ]]; then
            stage="public-verify-failed"
          fi

          if [[ "$stage" == "verified" || "$stage" == "release-skipped" ]]; then
            state="success"
          else
            state="failure"
          fi

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="demo-deploy-stage:$stage" \
            -f description="Demo deploy stage: $stage"

          echo "demo deploy stage: $stage"

          if [[ "$stage" != "verified" && "$stage" != "release-skipped" ]]; then
            exit 1
          fi


  finalize-release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.package.result == 'success' && needs.deploy-demo.result == 'success' && needs.package.outputs.release_eligible == 'true' }}
    needs:
      - package
      - deploy-demo
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write

    steps:
      - name: Download verified Windows installer
        uses: actions/download-artifact@v8
        with:
          name: family-circle-windows-installer
          path: release

      - name: Create immutable tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.release_version }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
        run: |
          set -euo pipefail

          installer="release/Family-Circle-Setup-${RELEASE_VERSION}.exe"
          [[ -f "$installer" ]] || { echo "Missing verified installer: $installer" >&2; exit 1; }

          checksum="$(sha256sum "$installer" | awk '{print $1}')"
          checksum_path="$installer.sha256"
          printf '%s  %s\n' "$checksum" "$(basename "$installer")" > "$checksum_path"

          existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$existing_sha" && "$existing_sha" != "$GITHUB_SHA" ]]; then
            echo "Release tag $RELEASE_TAG already points to $existing_sha instead of $GITHUB_SHA" >&2
            exit 1
          fi

          if [[ -z "$existing_sha" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$GITHUB_SHA" >/dev/null
            echo "Created $RELEASE_TAG -> $GITHUB_SHA"
          else
            echo "Tag $RELEASE_TAG already points to this commit; continuing idempotently."
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$installer" "$checksum_path" --clobber
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --title "Family Circle $RELEASE_TAG" \
              --generate-notes \
              "$installer" "$checksum_path"
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context="semantic-release:published" \
            -f description="Published $RELEASE_TAG after verified server deployment" >/dev/null

          echo "Published $RELEASE_TAG using the already-verified installer ($checksum)."

  report-demo-status:
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - package
      - deploy-demo
      - finalize-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Report demo deployment status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          DEPLOY_RESULT: ${{ needs.deploy-demo.result }}
          FINALIZE_RESULT: ${{ needs.finalize-release.result }}
          RELEASE_ELIGIBLE: ${{ needs.package.outputs.release_eligible }}
        run: |
          set -euo pipefail

          if [[ "$PACKAGE_RESULT" != "success" ]]; then
            state="failure"
            description="Windows package failed; server release not published"
          elif [[ "$DEPLOY_RESULT" == "success" && "$RELEASE_ELIGIBLE" != "true" ]]; then
            state="success"
            description="Server release skipped: commit is not Conventional"
          elif [[ "$DEPLOY_RESULT" == "success" && "$RELEASE_ELIGIBLE" == "true" && "$FINALIZE_RESULT" != "success" ]]; then
            state="failure"
            description="Server deploy verified but semantic tag/release failed"
          elif [[ "$DEPLOY_RESULT" == "success" ]]; then
            state="success"
            description="Demo server deployment and semantic release verified"
          elif [[ "$DEPLOY_RESULT" == "skipped" ]]; then
            state="failure"
            description="Demo server deployment was skipped"
          elif [[ "$DEPLOY_RESULT" == "cancelled" ]]; then
            state="failure"
            description="Demo server deployment was cancelled"
          else
            state="failure"
            description="Demo server deployment failed"
          fi

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="demo-server-deploy" \
            -f description="$description"

          echo "demo-server-deploy: $state"
          echo "package=$PACKAGE_RESULT deploy=$DEPLOY_RESULT finalize=$FINALIZE_RESULT"
