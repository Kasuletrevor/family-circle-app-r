name: Desktop shell CI

on:
  push:
    branches:
      - main
      - feature/desktop-shell
      - feature/auth-onboarding
      - feature/real-circle-home
      - feature/circles-create-invite
      - feature/circle-members-invitations
      - feature/vault-private-ai
      - feature/private-ai-rag
      - feature/windows-packaging-release
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate Conventional Commit PR title
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          release_prefix="$(printf '%s' "$PR_TITLE" | sed -nE 's/^([a-z][a-z0-9_-]*)(\([^)]+\))?!?:[[:space:]]+.+$/\1/p')"
          case "$release_prefix" in
            feat|fix|perf|refactor|chore|ci|docs)
              echo "Valid Conventional Commit title: $PR_TITLE"
              ;;
            *)
              echo "::error::PR title must use an approved Conventional Commit type: feat, fix, perf, refactor, chore, ci, or docs. Got: $PR_TITLE"
              exit 1
              ;;
          esac
      - name: Install dependencies
        run: npm ci --no-audit
      - name: Verify mail API configuration
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        env:
          SEND_EMAILS: ${{ vars.SEND_EMAILS }}
          MAIL_API_URL: ${{ vars.MAIL_API_URL }}
          MAIL_API_TIMEOUT_MS: ${{ vars.MAIL_API_TIMEOUT_MS }}
          MAIL_API_USER: ${{ secrets.MAIL_API_USER }}
          MAIL_API_PASSWORD: ${{ secrets.MAIL_API_PASSWORD }}
        run: node scripts/verify-mail-api-config.mjs
      - name: Verify desktop shell
        run: npm run check
      - name: Audit dependencies
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            audit_output="$(mktemp)"
            set +e
            NPM_CONFIG_FETCH_TIMEOUT=60000 timeout 90s npm audit --audit-level=high 2>&1 | tee "$audit_output"
            audit_status=${PIPESTATUS[0]}
            set -e

            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi

            if [ "$audit_status" -eq 124 ] || grep -Eiq 'network timeout|service unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN' "$audit_output"; then
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::npm audit advisory service unavailable (attempt $attempt/3); retrying."
                sleep $((attempt * 5))
                continue
              fi
            fi

            exit "$audit_status"
          done

          exit 1
