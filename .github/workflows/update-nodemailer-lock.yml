name: Temporary nodemailer lockfile update

on:
  push:
    branches:
      - feature/family-tree

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/family-tree
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Generate patched nodemailer lockfile
        run: npm install --package-lock-only --save-exact nodemailer@9.1.1
      - name: Commit generated dependency metadata
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency metadata already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: update nodemailer security patch"
          git push origin HEAD:feature/family-tree
