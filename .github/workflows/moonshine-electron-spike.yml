name: Moonshine Electron utility-process spike

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/moonshine-electron-spike.yml'
      - 'scripts/spikes/moonshine/**'
      - 'docs/spikes/2026-09-16-moonshine-electron-feasibility.md'

permissions:
  contents: read

jobs:
  moonshine-smoke:
    name: Moonshine utility smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out spike
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Family Circle dependencies
        run: npm ci

      - name: Install Moonshine for spike only
        run: npm install --no-save --package-lock=false @moonshine-ai/moonshine-wasm@0.1.5

      - name: Run Moonshine utility-process smoke on Linux
        if: runner.os == 'Linux'
        # GitHub-hosted Ubuntu does not install Electron's chrome-sandbox with
        # root ownership + mode 4755. This flag is confined to the disposable
        # spike runner; Family Circle's production BrowserWindow remains sandboxed.
        run: xvfb-run -a npx electron --no-sandbox scripts/spikes/moonshine/electron-runner.cjs

      - name: Run Moonshine utility-process smoke on Windows
        if: runner.os == 'Windows'
        run: npx electron scripts/spikes/moonshine/electron-runner.cjs

      - name: Print result
        if: always()
        shell: bash
        run: |
          if [ -f moonshine-spike-result.json ]; then
            cat moonshine-spike-result.json
          fi

      - name: Upload spike result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonshine-spike-${{ runner.os }}
          path: moonshine-spike-result.json
          if-no-files-found: warn
